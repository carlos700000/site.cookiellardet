<html lang="fr">
<head>

  <meta name="description" content="Tous les endroits où un cookie a été goûté, sur une carte du monde.">
  <meta property="og:title" content="Cookillardet">
  <meta property="og:description" content="Le journal de dégustation de cookies le plus impartial du monde.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%231d1915'/><text x='50' y='69' text-anchor='middle' font-family='Georgia,serif' font-size='58' fill='%23f7f3ec'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

<body>
  <header class="wrap hero stats-hero">
    <a class="back-link" href="index.html">← Toutes les enseignes</a>
    <h1>Carte du monde<span class="dot">.</span></h1>
    <p>Tous les endroits où un cookie a été goûté. Touche un point pour lire l'avis.</p>
    <div class="stats" id="kpis"></div>
    <div class="demo-banner" id="demoBanner" hidden>
      Aperçu : la base de données n'est pas encore branchée, la carte montre les anciens avis.
    </div>
  </header>

  <main class="wrap">
    <div class="map-card">
      <div id="map" role="region" aria-label="Carte des cookies goûtés"></div>
    </div>
    <p class="map-note" id="mapNote"></p>
  </main>

  <footer class="site-footer wrap">
    <span class="brand-mark">Cookillardet</span> · <a href="index.html">Accueil</a> · <a href="stats.html">Statistiques</a> · <a href="admin.html">Espace auteur</a>
  </footer>

  <script src="js/anciens-avis.js?v=12"></script>
